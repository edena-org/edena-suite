graalvm {
    js {
        # pool_size = 10
        # Run every eval in a fresh context instead of a reused one (full isolation, costs a context
        # creation per eval). Single calls can ask for it with evalToString(..., isolated = true).
        # fresh_context_per_use = false
        admin {
            js_shim_folders = ["fetch", "fs"]
            fetch {
                allowed_hosts = [".*"]
            }
            fs {
                allowed_roots = ["/tmp"]
                read_only = false
            }
        }
    }

    python {
        admin {
            venvs_root = "/opt/graalpy-venvs"
        }
        # pool_size = 10
        # See graalvm.js.fresh_context_per_use (a fresh GraalPy context costs ~0.2 s per eval).
        # fresh_context_per_use = false
        # Restore globals, builtins and pre-imported modules to their post-warmup snapshot after each
        # use (false = legacy reset that only clears bindings and globals)
        use_new_reset = true
    }
}