# Master key for symmetric (AES) encryption/decryption of `enc:v1:`-prefixed config values.
# See org.edena.core.security.SymmetricCrypto / ConfigDecryptor / EncodeEnvFileApp.
# REQUIRED to encrypt/decrypt - there is no hardcoded fallback; decryption fails fast if a value
# is encrypted but no source provides a key. Declared here so the binding is available to every
# module. Use a HIGH-ENTROPY key (key derivation is a single hash, no PBKDF2/Argon2): e.g. the
# output of `openssl rand -base64 32`. Leading/trailing whitespace is ignored.
edena.encryption-key = ${?EDENA_ENCRYPTION_KEY}

# Optional pepper / second factor mixed into key derivation (env EDENA_ENCRYPTION_PEPPER). When
# set, the master key alone cannot derive the AES key - an attacker also needs this value. Keep it
# OUT of the repo (a deployment secret). Changing/setting/unsetting it invalidates existing
# ciphertexts. When unset, the key is derived from the master key alone (no second factor).
edena.encryption-pepper = ${?EDENA_ENCRYPTION_PEPPER}

# Optional FILE sources for the key/pepper, so the secret need never appear in the environment.
# Point these at a file whose (trimmed) contents are the secret. If unset, SymmetricCrypto.apply
# also checks, in order: $CREDENTIALS_DIRECTORY/<name> (systemd LoadCredential), /run/secrets/
# edena-<name> (Docker/K8s), then a persistent bare-metal dir, then ~/.config/edena/<name> (dev) -
# where <name> is `encryption-key` / `encryption-pepper`. The persistent dir DIFFERS per secret so
# the two never share a folder: the KEY uses /etc/edena/secrets, the PEPPER uses /var/lib/edena/
# secrets. The inline value above takes precedence over any file. A secret file readable beyond its
# owner is warned about (chmod 600). Keep the pepper on a DIFFERENT trust boundary than the key.
edena.encryption-key-file = ${?EDENA_ENCRYPTION_KEY_FILE}
edena.encryption-pepper-file = ${?EDENA_ENCRYPTION_PEPPER_FILE}

# Set false to DISABLE scanning the ambient fixed fallback locations ($CREDENTIALS_DIRECTORY,
# /run/secrets, the persistent bare-metal dir, ~/.config/edena); secrets then come ONLY from the
# inline value or an explicit *_FILE pointer above. Default true. Turn off to forbid picking up a
# shared host file meant for a different app - and for hermetic tests.
edena.encryption-secret-discovery = true

# When decrypting `enc:v1:` env vars in place (see EnvDecryptor), ALL env vars are scanned and any
# carrying the enc:v1: prefix are decrypted. Rewriting env vars requires the JVM flag
# `--add-opens java.base/java.util=ALL-UNNAMED`.
