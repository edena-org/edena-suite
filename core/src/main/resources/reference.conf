# Master key for symmetric (AES) encryption/decryption of `enc:v1:`-prefixed config values.
# See org.edena.core.security.SymmetricCrypto / ConfigDecryptor / EncodeEnvFileApp.
# REQUIRED to encrypt/decrypt — there is no hardcoded fallback; decryption fails fast if a value
# is encrypted but this is unset. Declared here so the binding is available to every module.
# Use a HIGH-ENTROPY key (key derivation is a single hash, no PBKDF2/Argon2): e.g. the output of
# `openssl rand -base64 32`. Leading/trailing whitespace is ignored.
edena.encryption-key = ${?EDENA_ENCRYPTION_KEY}

# Optional pepper / second factor mixed into key derivation (env EDENA_ENCRYPTION_PEPPER). When
# set, the master key alone cannot derive the AES key — an attacker also needs this value. Keep it
# OUT of the repo (a deployment secret). Changing/setting/unsetting it invalidates existing
# ciphertexts. When unset, the key is derived from the master key alone (no second factor).
edena.encryption-pepper = ${?EDENA_ENCRYPTION_PEPPER}

# Optional allow-list (string array) of environment-variable names to consider when decrypting
# `enc:v1:` env vars in place (see EnvDecryptor). When unset, ALL env vars are scanned and any
# carrying the enc:v1: prefix are decrypted. Rewriting env vars requires the JVM flag
# `--add-opens java.base/java.util=ALL-UNNAMED`.
# edena.decrypt-env-keys = ["MYSERVICE_API_KEY", "AWS_BEDROCK_SECRET_KEY"]
