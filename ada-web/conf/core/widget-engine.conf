# DO NOT EDIT/UPDATE IN PRODUCTION BUT USE custom.conf TO OVERRIDE!

#################
# WIDGET ENGINE #
#################

widget_engine.defaultClassName = "PlotlyWidgetEngine"

widget_engine.providers = [
  {
    "name" : "Plotly",
    "className": "PlotlyWidgetEngine",
    "jsImports": [
      {"webjar": "plotly.js-dist", "path": "plotly.js"},

      // PDF export
      {"path": "jspdf.min.js"},
      {"path": "svg2pdf.min.js"},

      {"path": "plotly-widget-engine.js"}
    ]
  },

  // Highcharts 11.1.0 — NOT open-source. Free only for personal/non-commercial use; commercial or
  // governmental use requires a paid license from Highsoft (https://shop.highcharts.com/license).
  //
  // Each import carries BOTH a webjar location and a `url` failover: if the `org.webjars:highcharts`
  // webjar is on the classpath (a deployer holding a license may add it to their own build), the
  // local copy is served; otherwise the file is loaded from Highsoft's CDN (code.highcharts.com,
  // already allowed by the CSP in application.conf). See DataSetWebContext.resolveJsImport.
  {
    "name" : "Highcharts",
    "className": "HighchartsWidgetEngine",
    "jsImports": [
      {"webjar": "highcharts", "path": "code/highcharts.js",                 "url": "https://code.highcharts.com/11.1.0/highcharts.js"},
      {"webjar": "highcharts", "path": "code/modules/exporting.js",          "url": "https://code.highcharts.com/11.1.0/modules/exporting.js"},
      {"webjar": "highcharts", "path": "code/modules/heatmap.js",            "url": "https://code.highcharts.com/11.1.0/modules/heatmap.js"},
      {"webjar": "highcharts", "path": "code/highcharts-more.js",            "url": "https://code.highcharts.com/11.1.0/highcharts-more.js"},

      // Boost
      {"webjar": "highcharts", "path": "code/modules/boost.js",              "url": "https://code.highcharts.com/11.1.0/modules/boost.js"},
      {"webjar": "highcharts", "path": "code/modules/boost-canvas.js",       "url": "https://code.highcharts.com/11.1.0/modules/boost-canvas.js"},

      // Bulk Export
      {"webjar": "highcharts", "path": "code/modules/offline-exporting.js",  "url": "https://code.highcharts.com/11.1.0/modules/offline-exporting.js"},
      {"webjar": "highcharts", "path": "code/lib/jspdf.js",                  "url": "https://code.highcharts.com/11.1.0/lib/jspdf.js"},
      {"webjar": "highcharts", "path": "code/lib/svg2pdf.js",                "url": "https://code.highcharts.com/11.1.0/lib/svg2pdf.js"},

      {"path": "highcharts-widget-engine.js"}
    ]
  },

  {
    "name" : "ApexCharts",
    "className": "ApexChartsWidgetEngine",
    "jsImports": [
      {"webjar": "apexcharts", "path": "dist/apexcharts.min.js"},

      // PDF export
      {"path": "jspdf.min.js"},
      {"path": "svg2pdf.min.js"},

      {"path": "apexcharts-widget-engine.js"}
    ]
  },

  {
    "name" : "ECharts",
    "className": "EChartsWidgetEngine",
    "jsImports": [
      {"webjar": "echarts", "path": "dist/echarts.min.js"},

      // PDF export
      {"path": "jspdf.min.js"},
      {"path": "svg2pdf.min.js"},

      {"path": "echarts-widget-engine.js"}
    ]
  }
]